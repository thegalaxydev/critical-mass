<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Create: Critical Mass | Development Console</title>
<style>
:root{
  --bg:#141619;
  --bg-grid:rgba(201,162,74,.035);
  --surface:#1b1e22;
  --surface-2:#22262b;
  --surface-3:#2a2f35;
  --line:#33393f;
  --line-strong:#4a525b;
  --text:#ece6da;
  --text-muted:#aaa397;
  --text-faint:#7f796f;
  --brass:#c9a24a;
  --brass-strong:#e2bb62;
  --brass-soft:rgba(201,162,74,.14);
  --copper:#c97a45;
  --copper-soft:rgba(201,122,69,.15);
  --iron:#8d959e;
  --iron-soft:rgba(141,149,158,.16);
  --ok:#78a872;
  --ok-soft:rgba(120,168,114,.15);
  --warn:#d9a03a;
  --warn-soft:rgba(217,160,58,.15);
  --bad:#d0604c;
  --bad-soft:rgba(208,96,76,.15);
  --info:#7f9fbe;
  --info-soft:rgba(127,159,190,.15);
  --steam:#cdb36a;
  --cool:#6f9fc4;
  --primary-loop:#d0704c;
  --rivet:radial-gradient(circle at 50% 50%, #6b6355 0 1.6px, #2a2622 1.7px 2.4px, transparent 2.5px);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.25);
  --radius:6px;
  --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--brass-strong);
  --font:"Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  --pad-cell:10px 12px;
}
:root[data-theme="light"]{
  --bg:#ece7dd;
  --bg-grid:rgba(110,84,30,.05);
  --surface:#faf7f1;
  --surface-2:#f2ede4;
  --surface-3:#e7e0d3;
  --line:#d5ccbc;
  --line-strong:#b5aa96;
  --text:#1e2024;
  --text-muted:#575249;
  --text-faint:#7a7468;
  --brass:#86661c;
  --brass-strong:#6e5212;
  --brass-soft:rgba(134,102,28,.12);
  --copper:#9a4c1e;
  --copper-soft:rgba(154,76,30,.12);
  --iron:#5c636b;
  --iron-soft:rgba(92,99,107,.13);
  --ok:#3c7536;
  --ok-soft:rgba(60,117,54,.13);
  --warn:#8f5d00;
  --warn-soft:rgba(176,116,0,.14);
  --bad:#a33422;
  --bad-soft:rgba(163,52,34,.12);
  --info:#3d6488;
  --info-soft:rgba(61,100,136,.12);
  --steam:#8f7420;
  --cool:#3b6f99;
  --primary-loop:#b1462a;
  --rivet:radial-gradient(circle at 50% 50%, #b9ab90 0 1.6px, #8e826c 1.7px 2.4px, transparent 2.5px);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 4px 14px rgba(60,45,20,.08);
}
:root[data-density="compact"]{--pad-cell:5px 9px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background-color:var(--bg);
  background-image:linear-gradient(var(--bg-grid) 1px, transparent 1px),linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--text);
  font-family:var(--font);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{line-height:1.25;margin:0;font-weight:650;letter-spacing:.005em}
h1{font-size:1.7rem}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0 0 .8em}
a{color:var(--brass-strong)}
a:hover{color:var(--copper)}
code,.mono{font-family:var(--mono);font-size:.86em}
button,input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);outline:2px solid transparent;border-radius:4px}
.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:12px;top:-60px;background:var(--brass);color:#16130c;padding:8px 14px;border-radius:4px;z-index:100;font-weight:600;text-decoration:none}
.skip-link:focus{top:12px}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  z-index:30;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);position:relative}
.brand::after{content:"";position:absolute;left:20px;right:20px;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brass),var(--copper) 60%,transparent)}
.brand-mark{display:flex;align-items:center;gap:12px}
.brand-mark svg{flex:none}
.brand-title{font-weight:700;font-size:1.02rem;letter-spacing:.02em}
.brand-sub{font-family:var(--mono);font-size:.7rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.14em}
.nav{list-style:none;margin:0;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:5px;
  color:var(--text-muted);text-decoration:none;font-weight:500;border:1px solid transparent;
}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a[aria-current="page"]{background:var(--brass-soft);color:var(--text);border-color:color-mix(in srgb,var(--brass) 40%,transparent)}
.nav-num{font-family:var(--mono);font-size:.72rem;color:var(--brass);width:22px;flex:none}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--text-faint)}
.nav-count.bad{color:var(--bad)}
.sidebar-foot{margin-top:auto;padding:14px 18px 20px;border-top:1px solid var(--line);font-size:.8rem;color:var(--text-muted);display:flex;flex-direction:column;gap:10px}
.save-line{display:flex;align-items:flex-start;gap:8px}
.lamp{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--iron);box-shadow:0 0 0 2px var(--surface-3)}
.lamp.ok{background:var(--ok)}
.lamp.warn{background:var(--warn)}
.lamp.bad{background:var(--bad)}
.topbar{display:none}

main{padding:30px 40px 80px;min-width:0;max-width:1480px;width:100%}
main:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:.72rem;color:var(--brass);text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
.page-head p.lede{color:var(--text-muted);max-width:78ch;margin:8px 0 0}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}

.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);position:relative;
  background-image:var(--rivet),var(--rivet),var(--rivet),var(--rivet);
  background-size:10px 10px;background-repeat:no-repeat;
  background-position:5px 5px, calc(100% - 5px) 5px, 5px calc(100% - 5px), calc(100% - 5px) calc(100% - 5px);
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h2{font-size:.98rem}
.panel-head .eyebrow{margin:0}
.panel-body{padding:16px 20px 18px}
.panel-body.flush{padding:0}
.stack{display:flex;flex-direction:column;gap:20px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
.small{font-size:.84rem}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.tile{padding:14px 16px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass)}
.tile.ok::before{background:var(--ok)}
.tile.warn::before{background:var(--warn)}
.tile.bad::before{background:var(--bad)}
.tile:hover{border-color:var(--line-strong);background:var(--surface-2)}
.tile-label{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;color:var(--text-muted)}
.tile-value{font-family:var(--mono);font-size:1.7rem;font-weight:600;line-height:1.1}
.tile-value small{font-size:.9rem;color:var(--text-faint);font-weight:500}
.tile-note{font-size:.8rem;color:var(--text-muted)}

.meter{position:relative;height:10px;border-radius:2px;background:var(--surface-3);border:1px solid var(--line);overflow:hidden}
.meter>span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brass),var(--copper));}
.meter.ok>span{background:var(--ok)}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.28) calc(10% - 1px) 10%)}
:root[data-theme="light"] .meter::after{background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.55) calc(10% - 1px) 10%)}
.meter.thin{height:6px}
.meter-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.meter-row .meter{grid-column:1 / -1}
.stackbar{display:flex;height:14px;border-radius:2px;overflow:hidden;border:1px solid var(--line);background:var(--surface-3)}
.stackbar span{display:block;height:100%}

.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.plain::before{display:none}
.tone-iron{color:var(--iron);background:var(--iron-soft);border-color:color-mix(in srgb,var(--iron) 30%,transparent)}
.tone-info{color:var(--info);background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.tone-brass{color:var(--brass-strong);background:var(--brass-soft);border-color:color-mix(in srgb,var(--brass) 35%,transparent)}
.tone-copper{color:var(--copper);background:var(--copper-soft);border-color:color-mix(in srgb,var(--copper) 35%,transparent)}
.tone-warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tone-ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tone-bad{color:var(--bad);background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.bg-iron{background:var(--iron)}.bg-info{background:var(--info)}.bg-brass{background:var(--brass)}.bg-copper{background:var(--copper)}.bg-warn{background:var(--warn)}.bg-ok{background:var(--ok)}.bg-bad{background:var(--bad)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 14px;border-radius:5px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);cursor:pointer;font-weight:550;font-size:.88rem;line-height:1.3;
  text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--iron)}
.btn.primary{background:linear-gradient(180deg,var(--brass-strong),var(--brass));border-color:var(--brass);color:#17130a}
:root[data-theme="light"] .btn.primary{color:#fff8e8}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn.ghost:hover{background:var(--surface-3);color:var(--text)}
.btn.small{padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:left;font-weight:600;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--brass) 45%,transparent);text-underline-offset:3px}
.linkish:hover{color:var(--brass-strong);text-decoration-color:var(--brass-strong)}
.linkish.plain{font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);padding:6px 12px;cursor:pointer;font-size:.84rem;color:var(--text-muted);font-weight:550}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--brass-soft);color:var(--text)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:14px}
.toolbar .field{min-width:140px}
.toolbar .field.grow{flex:1 1 240px}
.toolbar-end{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.field>.label,fieldset>legend{font-size:.74rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.field .hint{font-size:.78rem;color:var(--text-faint)}
.field .err{font-size:.8rem;color:var(--bad);font-weight:600}
input[type="text"],input[type="search"],input[type="date"],input[type="url"],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:5px;padding:7px 10px;min-height:36px;
}
textarea{resize:vertical;min-height:72px;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--iron)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass-soft)}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brass);width:17px;height:17px;margin:0;cursor:pointer}
input[type="checkbox"]:focus-visible,input[type="radio"]:focus-visible{box-shadow:var(--focus)}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.88rem}
fieldset{border:0;padding:0;margin:0;min-width:0}
.result-count{font-family:var(--mono);font-size:.78rem;color:var(--text-muted)}

.table-wrap{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:var(--pad-cell);text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.th-sort{background:none;border:0;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.th-sort:hover{color:var(--text)}
.sort-ind{font-size:.7rem;color:var(--brass)}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.nowrap{white-space:nowrap}
tr.group-row td{background:var(--surface-2);font-weight:650;font-size:.82rem;padding-top:9px;padding-bottom:9px}
tr.is-done .task-title{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--text-faint)}
.cell-sub{display:block;font-family:var(--mono);font-size:.72rem;color:var(--text-faint);margin-top:2px}
table.matrix{min-width:1240px}
table.matrix td:nth-child(2),table.matrix td:nth-child(3),table.matrix td:nth-child(7){min-width:190px}
table.tasks-table{min-width:1000px}
table.tasks-table td:nth-child(2){min-width:300px}
.cell-select{min-height:30px;padding:3px 8px;font-size:.82rem;width:auto;max-width:150px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--line-strong)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-top>div{min-width:0;flex:1 1 auto}
.card-top>div .mono{overflow-wrap:anywhere}
.card-top>.chip{flex:none}
.card p{margin:0;color:var(--text-muted);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--text-faint);font-family:var(--mono)}

.empty{padding:34px 20px;text-align:center;color:var(--text-muted);border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}
.empty .btn{margin-top:12px}
.empty.inline{padding:14px 12px;text-align:left;border-style:dashed;background:transparent;font-size:.88rem}

.list-plain{list-style:none;margin:0;padding:0}
.list-rows>li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list-rows>li:last-child{border-bottom:0}
.list-rows .grow{flex:1 1 180px;min-width:0}
.pillars{counter-reset:p;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pillars li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.pillars li::before{content:counter(p,decimal-leading-zero);font-family:var(--mono);font-size:.78rem;color:var(--brass);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:4px;text-align:center;padding:2px 0;background:var(--brass-soft)}

.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border:1px solid;margin-bottom:16px;font-size:.9rem}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.banner.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
.banner strong{display:block}
.banner .grow{flex:1}

.toast-region{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(420px,calc(100vw - 36px))}
.toast{background:var(--surface-3);border:1px solid var(--line-strong);border-left:4px solid var(--brass);padding:10px 14px;border-radius:5px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:.88rem;animation:toast-in .18s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
@keyframes toast-in{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

dialog{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 24px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(8,9,10,.62)}
.editor{width:min(1000px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
.editor[open]{display:flex;flex-direction:column}
.editor form{display:flex;flex-direction:column;min-height:0;flex:1}
.dialog-head{padding:16px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;background:var(--surface-2)}
.dialog-head h2{font-size:1.12rem}
.dialog-body{padding:18px 22px;overflow-y:auto;flex:1;min-height:0}
.dialog-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2)}
.dialog-foot .spacer{flex:1}
.form-section{margin-bottom:22px}
.form-section>h3{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--brass);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .span-2{grid-column:1 / -1}
.form-errors{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);color:var(--text);border-radius:5px;padding:10px 14px;margin-bottom:16px;font-size:.88rem}
.form-errors ul{margin:4px 0 0;padding-left:18px}
.confirm-box{width:min(520px,calc(100vw - 24px))}
.confirm-box form{padding:20px 22px}
.confirm-box h2{margin-bottom:10px}

.ref-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong);font-size:.8rem;max-width:100%}

.ref-chip.static{padding-right:10px}
.ref-kind{font-family:var(--mono);font-size:.66rem;color:var(--brass);text-transform:uppercase;letter-spacing:.08em}
.chip-empty{font-size:.82rem;color:var(--text-faint)}
.link-chips{display:flex;flex-wrap:wrap;gap:6px}
.link-chip{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.8rem;cursor:pointer;color:var(--text)}
.link-chip:hover{border-color:var(--brass)}

.sys-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.subnav{position:sticky;top:20px}
.subnav ul{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px}
.subnav button{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:4px;padding:8px 10px;cursor:pointer;color:var(--text-muted);font-weight:500}
.subnav button:hover{background:var(--surface-3);color:var(--text)}

.prose{max-width:82ch}
.prose h3{margin:20px 0 8px;font-size:.98rem;color:var(--brass-strong)}
.prose h3:first-child{margin-top:0}
.prose ul,.prose ol{margin:0 0 12px;padding-left:22px}
.prose li{margin:3px 0}
.prose table{margin:6px 0 14px;border:1px solid var(--line)}
.schematic-wrap{overflow-x:auto}
.schematic{width:100%;min-width:680px;height:auto;display:block}
.schematic text{font-family:var(--font);fill:var(--text)}
.schematic .sx-label{font-size:13px;font-weight:600}
.schematic .sx-sub{font-size:10.5px;fill:var(--text-muted);font-family:var(--mono)}
.schematic .sx-comp rect,.schematic .sx-comp circle,.schematic .sx-comp polygon,.schematic .sx-comp path.body{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.5}
.schematic .sx-comp{cursor:pointer}
.schematic .sx-comp:hover rect,.schematic .sx-comp:hover circle,.schematic .sx-comp:hover polygon,.schematic .sx-comp:hover path.body,
.schematic .sx-comp:focus-visible rect,.schematic .sx-comp:focus-visible circle,.schematic .sx-comp:focus-visible polygon,.schematic .sx-comp:focus-visible path.body{stroke:var(--brass-strong);stroke-width:2.5;fill:var(--surface-3)}

.schematic .pipe{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.schematic .p-primary{stroke:var(--primary-loop)}
.schematic .p-steam{stroke:var(--steam)}
.schematic .p-cool{stroke:var(--cool)}
.schematic .p-aux{stroke:var(--iron);stroke-dasharray:6 5;stroke-width:2.5}
.schematic .p-shaft{stroke:var(--iron);stroke-width:6}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.82rem;color:var(--text-muted);margin-top:10px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:26px;height:4px;border-radius:2px}

.failure{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-2);padding:14px 16px}

.failure-grid h4,.kv h4{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-bottom:3px;font-weight:600}
.failure-grid p,.kv p{margin:0;font-size:.88rem;white-space:pre-line}
.pre{white-space:pre-line}
.kv{display:flex;flex-direction:column;gap:12px}
.kv>div{padding-bottom:10px;border-bottom:1px solid var(--line)}
.kv>div:last-child{border-bottom:0;padding-bottom:0}

.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}

.board-col-head{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);position:relative}
.board-col-head::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:6px 6px 0 0;background:var(--iron)}
.board-col[data-status="In Progress"] .board-col-head::before{background:var(--copper)}
.board-col[data-status="Blocked"] .board-col-head::before{background:var(--bad)}
.board-col[data-status="Done"] .board-col-head::before{background:var(--ok)}
.board-list{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.task-card{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:grab}

.task-card.dragging{opacity:.45}
.task-card-top{display:flex;gap:10px;align-items:flex-start}
.task-card-top input{margin-top:3px}
.task-card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.76rem;color:var(--text-faint)}
.task-card.is-done .task-title{text-decoration:line-through;color:var(--text-faint)}
.dep-warn{color:var(--warn);font-size:.76rem;font-weight:600}
.overdue{color:var(--bad);font-weight:600}

.ms-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:4px 18px}
.ms-item{display:grid;grid-template-columns:36px minmax(0,1fr) 92px;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:5px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;width:100%;color:inherit}
.ms-item:hover{background:var(--surface-2)}
.ms-item[aria-pressed="true"]{border-color:color-mix(in srgb,var(--brass) 45%,transparent);background:var(--brass-soft)}
.ms-num{font-family:var(--mono);font-size:.76rem;color:var(--brass)}
.ms-name{font-size:.88rem;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-stat{font-family:var(--mono);font-size:.74rem;color:var(--text-muted);text-align:right}
.ms-item .meter{grid-column:2 / 4}

.decision{padding:16px 20px}
.decision+.decision{border-top:1px solid var(--line)}
.decision-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.decision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px}
.scratch textarea{min-height:340px;font-family:var(--mono);font-size:.86rem}
.save-state{font-family:var(--mono);font-size:.76rem;color:var(--text-muted)}

.design-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kv-table th{width:34%;font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);background:var(--surface-2);font-weight:600}
.compare th[scope="row"]{width:18%}
.compare td{width:41%}

.import-summary table{margin:10px 0}
.danger-zone{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.radio-row{display:flex;flex-wrap:wrap;gap:14px}
.stat-dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:.88rem}
.stat-dl dt{color:var(--text-muted)}
.stat-dl dd{margin:0;font-family:var(--mono)}

.tone-faint{color:var(--text-faint);background:transparent;border-color:var(--line-strong);border-style:dashed}
.bg-faint{background:repeating-linear-gradient(135deg,var(--line-strong) 0 3px,transparent 3px 6px)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs [role="tab"]{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-bottom:none;border-radius:5px 5px 0 0;padding:8px 14px;margin-bottom:-1px;cursor:pointer;color:var(--text-muted);font-weight:550;font-size:.9rem}
.tabs [role="tab"]:hover{color:var(--text);background:var(--surface-2)}
.tabs [role="tab"][aria-selected="true"]{color:var(--text);background:var(--surface);border-color:var(--line);box-shadow:inset 0 2px 0 var(--brass)}
.tab-count{font-family:var(--mono);font-size:.72rem;color:var(--text-faint)}
.totals{display:flex;flex-wrap:wrap;gap:6px 22px;margin:-6px 0 16px;font-size:.88rem;color:var(--text-muted)}
.totals strong{font-family:var(--mono);color:var(--text);font-size:1rem;margin-right:4px}
.io-rows{display:flex;flex-direction:column;gap:8px}
.io-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.io-row select{flex:2 1 220px;width:auto}
.io-row input[type="text"]{flex:1 1 150px;width:auto}
.io-row .btn{flex:none}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain-row h3{margin-bottom:6px}
.chain-step{background:none;border:1px dashed var(--line-strong);border-radius:4px;padding:2px 8px;font-size:.78rem;color:var(--text-muted);cursor:pointer}
.chain-step:hover{color:var(--brass-strong);border-color:var(--brass)}
.link-chip .mono{font-size:.72rem}
.ref-chip.static .mono{font-size:.72rem;margin-left:4px}
ul.legend{display:flex;flex-wrap:wrap;gap:6px 16px}
table.recipe-table{min-width:1180px}
table.recipe-table td:nth-child(1){min-width:200px}
table.recipe-table td:nth-child(2),table.recipe-table td:nth-child(4){min-width:230px}
table.content-table{min-width:980px}
.scrim{display:none}
@media (max-width:1180px){
  .grid-main{grid-template-columns:1fr}
  .decision-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  .topbar .brand-title{font-size:.95rem}
  .topbar .spacer{flex:1}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:282px;transform:translateX(-102%);transition:transform .2s ease;box-shadow:12px 0 30px rgba(0,0,0,.35);visibility:hidden}
  .sidebar.open{transform:none;visibility:visible}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:28}
  main{padding:22px 16px 70px}
  .sys-layout{grid-template-columns:1fr}
  .subnav{position:static}
  .subnav ul{flex-direction:row;flex-wrap:wrap}
  .subnav button{width:auto}
}
@media (max-width:760px){
  .grid-2,.design-cols,.failure-grid,.form-grid,.decision-grid{grid-template-columns:1fr}
  .form-grid .span-2{grid-column:auto}
  h1{font-size:1.4rem}
  .toolbar .field{min-width:calc(50% - 6px);flex:1 1 calc(50% - 6px)}
  .toolbar-end{margin-left:0;width:100%}
  .board{grid-template-columns:repeat(4,minmax(260px,82vw))}
  .dialog-body{padding:14px 16px}
  .dialog-head,.dialog-foot{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
@media print{
  .sidebar,.topbar,.toast-region,.head-actions,.toolbar{display:none!important}
  .app{display:block}
  body{background:#fff;color:#000}
}

      else errs.push(label + " field " + k + " has unknown value \"" + String(v).slice(0, 60) + "\".");
    }

  for (const r of spec.required) if (!out[r] || !String(out[r]).trim()) errs.push(label + " requires " + r + ".");

function validateProject(raw) {
  const errors = [];
  const warnings = [];
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { ok: false, errors: ["The file does not contain a JSON object."], warnings };
  if (raw.app !== APP_ID) errors.push("This is not a Critical Mass development console export (app identifier missing or different).");
  if (typeof raw.schemaVersion !== "number" || !Number.isInteger(raw.schemaVersion)) errors.push("schemaVersion is missing or not an integer.");
  else if (raw.schemaVersion > SCHEMA_VERSION) errors.push("schemaVersion " + raw.schemaVersion + " is newer than this console supports (" + SCHEMA_VERSION + ").");
  else if (raw.schemaVersion < 1) errors.push("schemaVersion " + raw.schemaVersion + " is not valid.");
  if (errors.length) return { ok: false, errors, warnings };
  let migration = null;
  if (raw.schemaVersion < SCHEMA_VERSION) {
    try {
      const mig = migrateProject(raw);
      raw = mig.data;
      migration = mig.report;
    } catch (e) {
      return { ok: false, errors: ["Migration from schema " + raw.schemaVersion + " failed: " + ((e && e.message) || "unknown error")], warnings };
    }
  }

  const data = { schemaVersion: SCHEMA_VERSION, app: APP_ID };
  const allIds = new Set();
  for (const key of COLLECTION_KEYS) {
    if (!Array.isArray(raw[key])) { errors.push("Collection \"" + key + "\" is missing or not a list."); data[key] = []; continue; }
    data[key] = [];
    raw[key].forEach((r, i) => {
      const rec = normalizeRecord(key, r, i, errors);
      if (!rec) return;
      if (allIds.has(rec.id)) { errors.push("Duplicate record id \"" + rec.id + "\"."); return; }
      allIds.add(rec.id);
      data[key].push(rec);
    });
  }
  if (!data.milestones.length) errors.push("At least one milestone is required.");

  const m = raw.meta && typeof raw.meta === "object" && !Array.isArray(raw.meta) ? raw.meta : null;
  if (!m) errors.push("meta section is missing.");
  const appliedSeeds = m && Array.isArray(m.appliedSeeds) ? m.appliedSeeds.filter(x => typeof x === "string") : [];
  const meta = {
    projectName: m && typeof m.projectName === "string" ? m.projectName : SEED_META.projectName,
    description: m && typeof m.description === "string" ? m.description : "",
    pillars: m && Array.isArray(m.pillars) ? m.pillars.filter(p => typeof p === "string") : [],
    target: m && typeof m.target === "string" ? m.target : SEED_META.target,
    currentMilestoneId: m && typeof m.currentMilestoneId === "string" ? m.currentMilestoneId : "",
    appliedSeeds,
    savedAt: m && typeof m.savedAt === "string" ? m.savedAt : null,
    lastExportAt: m && typeof m.lastExportAt === "string" ? m.lastExportAt : null,
    updatedAt: m && typeof m.updatedAt === "string" ? m.updatedAt : null
  };
  if (meta.description.length > MAX_TEXT) errors.push("meta.description is too long.");
  data.meta = meta;

  const sp = raw.scratchpad;
  if (sp != null && (typeof sp !== "object" || (sp.text != null && typeof sp.text !== "string"))) errors.push("scratchpad must contain text.");
  data.scratchpad = { text: sp && typeof sp.text === "string" ? sp.text : "", updatedAt: sp && typeof sp.updatedAt === "string" ? sp.updatedAt : null };
  if (data.scratchpad.text.length > 500000) errors.push("scratchpad text is too long.");

  const p = raw.prefs && typeof raw.prefs === "object" ? raw.prefs : {};
  data.prefs = {
    theme: ["dark", "light", "system"].includes(p.theme) ? p.theme : "dark",
    density: ["comfortable", "compact"].includes(p.density) ? p.density : "comfortable",
    catalogView: ["table", "cards"].includes(p.catalogView) ? p.catalogView : "table",
    taskView: ["list", "board"].includes(p.taskView) ? p.taskView : "list",
    lastRecord: typeof p.lastRecord === "string" ? p.lastRecord : ""
  };
  if (errors.length) return { ok: false, errors, warnings, migration };

  const msIds = new Set(data.milestones.map(x => x.id));
  const taskIds = new Set(data.tasks.map(x => x.id));
  const pruneRefs = (rec, field, valid, what) => {
    const kept = rec[field].filter(id => valid(id));
    const dropped = rec[field].length - kept.length;
    if (dropped) warnings.push(rec.id + ": removed " + dropped + " " + what + " pointing to missing records.");
    rec[field] = kept;
  };
  const anyRecord = id => allIds.has(id) && !id.startsWith("ms-");
  for (const b of data.blocks) {
    pruneRefs(b, "compat", id => id.startsWith("cmp-") && allIds.has(id), "compatibility reference(s)");
    if (b.milestoneId && !msIds.has(b.milestoneId)) { warnings.push(b.id + ": unknown milestone cleared."); b.milestoneId = ""; }
  }
  for (const coll of ["items", "fluids"]) {
    for (const r of data[coll]) {
      pruneRefs(r, "compat", id => id.startsWith("cmp-") && allIds.has(id), "compatibility reference(s)");
      pruneRefs(r, "machines", id => id.startsWith("blk-") && allIds.has(id), "machine reference(s)");
      if (r.milestoneId && !msIds.has(r.milestoneId)) { warnings.push(r.id + ": unknown milestone cleared."); r.milestoneId = ""; }
    }
  }
  const contentIds = new Set(CONTENT_KEYS.flatMap(k => data[CONTENT[k].coll].map(r => r.id)));
  for (const r of data.recipes) {
    for (const f of ["inputs", "outputs", "byproducts"]) {
      r[f].forEach((line, j) => { if (line.id && !contentIds.has(line.id)) errors.push("Recipe \"" + r.id + "\" " + f + "[" + j + "] references missing catalog record \"" + line.id + "\"."); });
    }
    if (r.machineRef && !contentIds.has(r.machineRef)) errors.push("Recipe \"" + r.id + "\" machine references missing catalog record \"" + r.machineRef + "\".");
  }
  for (const t of data.tasks) {
    pruneRefs(t, "deps", id => taskIds.has(id) && id !== t.id, "dependency reference(s)");
    pruneRefs(t, "links", anyRecord, "link(s)");
    if (t.milestoneId && !msIds.has(t.milestoneId)) { warnings.push(t.id + ": unknown milestone cleared."); t.milestoneId = ""; }
  }
  for (const d of data.decisions) pruneRefs(d, "related", anyRecord, "related reference(s)");
  for (const f of data.failures) pruneRefs(f, "related", anyRecord, "related reference(s)");
  for (const sy of data.systems) pruneRefs(sy, "relatedBlocks", id => id.startsWith("blk-") && allIds.has(id), "block reference(s)");
  if (!msIds.has(data.meta.currentMilestoneId)) data.meta.currentMilestoneId = data.milestones[0].id;

  const cycle = findCycleInTasks(data.tasks);
  if (cycle) errors.push("Circular task dependency: " + cycle.join(" → ") + ".");
  if (errors.length) return { ok: false, errors, warnings, migration };
  return { ok: true, errors, warnings, data, migration };
}

function migrateProject(raw) {
  const data = JSON.parse(JSON.stringify(raw));
  const report = { from: raw.schemaVersion, to: SCHEMA_VERSION, added: { items: 0, fluids: 0, recipes: 0, tasks: 0, decisions: 0, systems: 0 }, adjusted: [] };
  if (data.schemaVersion === 1) {
    migrateV1toV2(data, report);
    data.schemaVersion = 2;
  }
  if (data.schemaVersion !== SCHEMA_VERSION) throw new Error("no migration path from schema " + data.schemaVersion);
  return { data, report };
}
function migrateV1toV2(data, report) {
  if (!data.meta || typeof data.meta !== "object" || Array.isArray(data.meta)) throw new Error("meta section is missing");
  for (const k of ["items", "fluids", "recipes"]) {
    if (data[k] == null) data[k] = [];
    else if (!Array.isArray(data[k])) throw new Error("\"" + k + "\" exists but is not a list");
  }
  const applied = Array.isArray(data.meta.appliedSeeds) ? data.meta.appliedSeeds.filter(x => typeof x === "string") : [];
  if (!applied.includes("core-v1")) applied.push("core-v1");
  if (!applied.includes("content-v2")) {
    applySeedSet(data, CONTENT_V2_SEED(), report);
    applied.push("content-v2");
  }
  data.meta.appliedSeeds = applied;
}
function applySeedSet(data, seed, report) {
  const ids = new Set();
  for (const key of COLLECTION_KEYS) if (Array.isArray(data[key])) for (const r of data[key]) if (r && typeof r.id === "string") ids.add(r.id);
  const added = [];
  for (const [coll, recs] of Object.entries(seed)) {
    if (!Array.isArray(data[coll])) throw new Error("\"" + coll + "\" is missing or not a list");
    for (const rec of recs) {
      if (ids.has(rec.id)) continue;
      data[coll].push(rec);
      ids.add(rec.id);
      added.push({ coll, rec });
      report.added[coll] = (report.added[coll] || 0) + 1;
    }
  }
  const keep = (rec, field) => {
    if (!Array.isArray(rec[field])) return;
    const before = rec[field].length;
    rec[field] = rec[field].filter(id => ids.has(id));
    if (rec[field].length !== before) report.adjusted.push(rec.id + ": dropped " + (before - rec[field].length) + " " + field + " reference(s) to records not in this project");
  };
  for (const { coll, rec } of added) {
    if (coll === "tasks") { keep(rec, "deps"); keep(rec, "links"); }
    else if (coll === "decisions") keep(rec, "related");
    else if (coll === "systems") keep(rec, "relatedBlocks");
    else if (coll === "items" || coll === "fluids") { keep(rec, "machines"); keep(rec, "compat"); }
    else if (coll === "recipes") {
      for (const f of ["inputs", "outputs", "byproducts"]) {
        rec[f] = rec[f].map(line => {
          if (!line.id || ids.has(line.id)) return line;
          report.adjusted.push(rec.id + ": " + line.id + " is not in this project, kept as a plain label");
          return { id: "", label: line.id + " (not in this project)", qty: line.qty };
        });
      }
      if (rec.machineRef && !ids.has(rec.machineRef)) { report.adjusted.push(rec.id + ": machine " + rec.machineRef + " is not in this project"); rec.machineRef = ""; }
    }
  }
}
function migrationSummary(report) {
  const a = report.added;
  const parts = [["items", "item"], ["fluids", "fluid"], ["recipes", "recipe/process", "recipes/processes"], ["tasks", "task"], ["decisions", "decision"], ["systems", "system page"]]
    .filter(([k]) => a[k]).map(([k, one, many]) => plural(a[k], one, many));
  return "Schema " + report.from + " → " + report.to + ". Added " + (parts.length ? parts.join(", ") : "no new records") + "." + (report.adjusted.length ? " " + plural(report.adjusted.length, "reference") + " adjusted for records you had removed." : "");
}
function downloadText(text, filename) {

  const a = h("a", { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

function persist() {
  if (!storageOK) { ui.save.error = "Storage unavailable"; updateSaveIndicators(); return false; }
  if (ui.saveBlocked) { ui.save.error = "Saving paused"; updateSaveIndicators(); return false; }
  try {
    const savedAt = nowISO();
    const prev = state.meta.savedAt;
    state.meta.savedAt = savedAt;
    const json = JSON.stringify(state);
    try { localStorage.setItem(STORAGE_KEY, json); } catch (e) { state.meta.savedAt = prev; throw e; }
    ui.save.at = new Date(savedAt);
    ui.save.error = null;
    ui.save.bytes = json.length;

    updateSaveIndicators();

  } catch (e) {

    addBanner({ id: "save-error", tone: "bad", title: "Your latest change was not saved", text: isQuotaError(e) ? "The browser's storage quota for this page is full. Export your data now, then shorten long notes or the scratchpad, or clear other site data for this file location." : "The browser refused to save: " + ((e && e.message) || "unknown error") + ". Export your data to keep it.", actions: [{ label: "Export JSON now", fn: exportData }] });

    const okBtn = h("button", { type: "button", value: "ok", class: "btn " + (opts.tone === "danger" ? "danger" : "primary"), onclick: () => finish(true) }, opts.confirmLabel || "Confirm");
    d.oncancel = e => { e.preventDefault(); finish(false); };

function refsControl(f, initial, ctxId, describedBy) {

  const chips = h("ul", { class: "chips", "aria-label": "Selected " + f.label.toLowerCase() });

function validateEditor(ctx, values) {
  const errors = [];
  for (const c of ctx.controls) {
    if (c.err) { c.err.hidden = true; c.err.textContent = ""; c.focusEl.removeAttribute("aria-invalid"); }
    const f = c.def;
    let msg = null;
    if (f.required && !String(values[c.key] || "").trim()) msg = f.label + " is required.";
    else if (f.validate) msg = f.validate(values[c.key]);
    else if (typeof values[c.key] === "string" && values[c.key].length > MAX_TEXT) msg = f.label + " is longer than " + MAX_TEXT + " characters.";
    if (msg) {
      errors.push({ c, msg });
      if (c.err) { c.err.hidden = false; c.err.textContent = msg; c.focusEl.setAttribute("aria-invalid", "true"); c.focusEl.setAttribute("aria-describedby", c.err.id); }
    }
  }
  if (ctx.key === "rcp") {
    const ioErr = (key, label) => {
      const c = ctx.controls.find(x => x.key === key);
      const lines = values[key] || [];
      lines.forEach((line, i) => { if (!line.id && !line.label) errors.push({ c, msg: label + " " + (i + 1) + " needs a catalog record or an external name." }); });
      return { c, lines };
    };
    const ins = ioErr("inputs", "Input");
    const outs = ioErr("outputs", "Output");
    ioErr("byproducts", "Byproduct");
    if (!ins.lines.length) errors.push({ c: ins.c, msg: "Add at least one input." });
    if (!outs.lines.length) errors.push({ c: outs.c, msg: "Add at least one output." });
  }
  if (ctx.key === "tsk") {
    const selfId = ctx.id || "__new__";
    const cycle = cycleForDeps(selfId, values.deps);
    if (cycle) {
      const names = cycle.map(x => x === "__new__" ? "this task" : x);
      errors.push({ c: ctx.controls.find(c => c.key === "deps"), msg: "Circular dependency rejected: " + names.join(" → ") + ". Remove one of these dependencies." });
    }
  }
  return errors;
}
function showEditorErrors(ctx, errors) {
  if (!errors.length) { ctx.errBox.hidden = true; ctx.errBox.replaceChildren(); return; }
  ctx.errBox.hidden = false;
  ctx.errBox.replaceChildren(h("strong", {}, "Please fix " + plural(errors.length, "problem") + " before saving:"), h("ul", {}, errors.map(e => h("li", {}, e.msg))));
  ctx.errBox.scrollIntoView({ block: "nearest" });
  const first = errors[0].c;
  if (first && first.focusEl) first.focusEl.focus();
}

async function saveEditor() {
  const ctx = ui.editor;
  if (!ctx) return;
  const values = readEditorValues();
  const errors = validateEditor(ctx, values);
  showEditorErrors(ctx, errors);
  if (errors.length) return;
  if (ctx.key === "tsk" && values.status === "Done") {
    const wasDone = ctx.id && taskById(ctx.id) && isDone(taskById(ctx.id));
    const open = unfinishedDeps(values.deps);
    if (!wasDone && open.length) {
      const ok = await confirmDialog({ title: "Complete with unfinished dependencies?", message: "This task depends on " + plural(open.length, "unfinished task") + ". You can override and mark it done anyway.", items: open.map(o => o.id + " · " + o.title + " (" + o.status + ")"), confirmLabel: "Complete anyway" });
      if (!ok) return;
    }
  }
  const key = ctx.key;
  let savedId = ctx.id;
  commit(() => {
    if (key === "meta") {
      state.meta.description = values.description;
      state.meta.pillars = values.pillars;
      state.meta.target = values.target;
      touch(state.meta);
      return;
    }
    const K = KINDS[key];
    let rec = ctx.id ? findRecord(ctx.id).rec : null;
    if (!rec) {
      rec = Object.assign(newRecordDefaults(key), { id: newId(K.coll === "tasks" ? "tsk" : key) });
      if (key === "tsk") rec.createdAt = nowISO();
      state[K.coll].push(rec);
      savedId = rec.id;
    }
    for (const c of ctx.controls) {
      if (c.key.startsWith("__")) continue;
      let val = values[c.key];
      if (c.def.spec && typeof val === "string" && !val.trim()) val = "TBD";
      rec[c.key] = val;
    }
    const backlinks = ctx.controls.find(c => c.key === "__tasks");
    if (backlinks) syncBacklinks(rec.id, values.__tasks);
    touch(rec);
  });
  await closeEditor(true);
  toast(ctx.isNew ? "Created " + recordLabel(savedId || "") : "Saved " + (key === "meta" ? "project overview" : recordLabel(savedId)));
}

function syncBacklinks(recId, taskIds) {
  const want = new Set(taskIds);
  for (const t of state.tasks) {
    const has = t.links.includes(recId);
    if (want.has(t.id) && !has) { t.links.push(recId); touch(t); }
    else if (!want.has(t.id) && has) { t.links = t.links.filter(x => x !== recId); touch(t); }
  }
}

function referencesTo(id) {
  const refs = [];
  for (const t of state.tasks) {
    if (t.deps.includes(id)) refs.push(t.id + " · " + t.title + " (dependency)");
    if (t.links.includes(id)) refs.push(t.id + " · " + t.title + " (link)");
  }
  for (const d of state.decisions) if (d.related.includes(id)) refs.push(d.title + " (decision)");
  for (const f of state.failures) if (f.related.includes(id)) refs.push(f.title + " (failure mode)");
  for (const sy of state.systems) if (sy.relatedBlocks.includes(id)) refs.push(sy.title + " (system)");
  for (const k of CONTENT_KEYS) for (const r of state[CONTENT[k].coll]) {
    if (r.compat.includes(id)) refs.push(r.name + " (compatibility dependency)");
    if (r.machines && r.machines.includes(id)) refs.push(r.name + " (machine reference)");
  }
  for (const r of state.recipes) {
    if (["inputs", "outputs", "byproducts"].some(f => r[f].some(x => x.id === id))) refs.push(r.title + " (recipe entry, kept as a plain label)");
    if (r.machineRef === id) refs.push(r.title + " (recipe machine)");
  }
  return refs;
}
function purgeReferences(id) {
  for (const t of state.tasks) { t.deps = t.deps.filter(x => x !== id); t.links = t.links.filter(x => x !== id); }
  for (const d of state.decisions) d.related = d.related.filter(x => x !== id);
  for (const f of state.failures) f.related = f.related.filter(x => x !== id);
  for (const sy of state.systems) sy.relatedBlocks = sy.relatedBlocks.filter(x => x !== id);
  const label = recordLabel(id);
  for (const k of CONTENT_KEYS) for (const r of state[CONTENT[k].coll]) {
    r.compat = r.compat.filter(x => x !== id);
    if (r.machines) r.machines = r.machines.filter(x => x !== id);
  }
  for (const r of state.recipes) {
    for (const f of ["inputs", "outputs", "byproducts"]) r[f] = r[f].map(x => x.id === id ? { id: "", label: label + " (deleted)", qty: x.qty } : x);
    if (r.machineRef === id) { r.machineRef = ""; if (!r.method) r.method = label + " (deleted)"; }
  }
  if (state.prefs.lastRecord === id) state.prefs.lastRecord = "";
}

async function deleteRecord(key, id) {
  const f = findRecord(id);
  if (!f) return;
  const refs = referencesTo(id);
  if (findRecord(id) == null) return;
  const ok = await confirmDialog({
    title: "Delete " + f.K.label.toLowerCase() + "?",
    message: "\"" + f.K.title(f.rec) + "\" will be permanently removed from this project." + (refs.length ? " These references will also be removed so links stay consistent:" : " No other records reference it."),
    items: refs, confirmLabel: "Delete", tone: "danger"
  });
  if (!ok) return;
  if (ui.editor && ui.editor.id === id) await closeEditor(true);
  commit(() => {
    purgeReferences(id);
    state[f.K.coll] = state[f.K.coll].filter(r => r.id !== id);
  });
  toast("Deleted " + f.K.title(f.rec) + (refs.length ? " and " + plural(refs.length, "reference") : ""), "warn");

async function duplicateFromEditor() {
  const ctx = ui.editor;
  if (!ctx || !ctx.id) return;
  const values = readEditorValues();
  const key = ctx.key;
  const K = KINDS[key];
  const src = findRecord(ctx.id).rec;
  const copy = JSON.parse(JSON.stringify(src));
  for (const c of ctx.controls) if (!c.key.startsWith("__")) copy[c.key] = values[c.key];
  copy.id = newId(key);
  if (key === "blk" || key === "itm" || key === "fld") {
    copy.name = (copy.name || K.label) + " (copy)";
    copy.registryId = /^tbd$/i.test(copy.registryId) || !copy.registryId ? "TBD" : copy.registryId + "_copy";
    copy.status = "Proposed";
  } else if (key === "tsk") {
    copy.title = copy.title + " (copy)";
    copy.status = "Todo";
    copy.createdAt = nowISO();
  } else if (key === "dec") {
    copy.title = copy.title + " (copy)";
    copy.status = "Open";
  } else if (key === "rcp") {
    copy.title = copy.title + " (copy)";
    copy.status = "Proposed";
  }
  touch(copy);
  await closeEditor(true);
  commit(() => { state[K.coll].push(copy); });
  toast("Created copy: " + K.title(copy) + ". The original was not changed.");
  navigate(K.section, copy.id);
}

async function setTaskStatus(id, status) {
  const t = taskById(id);
  if (!t || t.status === status) { renderMain(); return; }
  if (status === "Done") {
    const open = unfinishedDeps(t.deps);
    if (open.length) {
      const ok = await confirmDialog({ title: "Complete with unfinished dependencies?", message: "\"" + t.title + "\" depends on " + plural(open.length, "unfinished task") + ". You can override and mark it done anyway.", items: open.map(o => o.id + " · " + o.title + " (" + o.status + ")"), confirmLabel: "Complete anyway" });
      if (!ok) { renderMain(); return; }
    }
  }
  commit(() => { t.status = status; touch(t); });
}

function renderBody(text) {

  let list = null, listType = null, table = null, para = [];
  const flushPara = () => { if (para.length) { out.push(h("p", {}, para.join(" "))); para = []; } };
  const flushList = () => { if (list) { out.push(list); list = null; listType = null; } };

  const flushAll = () => { flushPara(); flushList(); flushTable(); };
  for (const raw of String(text || "").split(/\r?\n/)) {

    else if (line.startsWith("|")) {

  }

}

function setMobileNav(open) {
  const sb = $("#sidebar");
  sb.classList.toggle("open", open);
  $("#scrim").classList.toggle("open", open);
  $("#menu-toggle").setAttribute("aria-expanded", String(open));
  if (open) { const a = sb.querySelector(".nav a"); if (a) a.focus(); }
}
function closeMobileNav() { if ($("#sidebar").classList.contains("open")) setMobileNav(false); }

function toggleTheme() { setPref("theme", resolvedTheme() === "dark" ? "light" : "dark", ui.section === "backup"); }

function init() {
  state = loadState();
  if (ui.migrated) persist();
  applyPrefs();
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: light)");
    const onChange = () => { if (state.prefs.theme === "system") applyPrefs(); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
  }
  $("#theme-toggle").addEventListener("click", toggleTheme);
  $("#theme-toggle-top").addEventListener("click", toggleTheme);
  $("#quick-export").addEventListener("click", exportData);
  $("#menu-toggle").addEventListener("click", () => setMobileNav(!$("#sidebar").classList.contains("open")));
  $("#scrim").addEventListener("click", () => setMobileNav(false));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("#sidebar").classList.contains("open")) { setMobileNav(false); $("#menu-toggle").focus(); }
  });
  $("#editor-dialog").addEventListener("cancel", e => { e.preventDefault(); closeEditor(); });
  window.addEventListener("hashchange", handleRoute);
  window.addEventListener("storage", e => {
    if (e.key !== STORAGE_KEY) return;
    addBanner({ id: "other-tab", tone: "warn", title: "Data changed in another tab", text: "Another tab or window saved changes to this console. Reload to see them; saving here will overwrite them.", actions: [{ label: "Reload now", fn: () => location.reload() }], dismissible: true });
    renderMain();
  });
  const flushScratch = () => { if (scratchTimer) { const a = document.getElementById("scratch"); if (a) saveScratch(a.value, document.getElementById("scratch-status")); } };
  window.addEventListener("beforeunload", flushScratch);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushScratch(); });
  handleRoute();
  updateSaveIndicators();
}

init();
</script>
</body>
</html>
