plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'Create, Ponder, Flywheel'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    maven {
        name = 'Registrate'
        url = 'https://mvn.devos.one/snapshots'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'Sable'
        url = 'https://maven.ryanhcode.dev/releases'
        content {
            includeGroup 'dev.ryanhcode.sable'
            includeGroup 'dev.ryanhcode.sable-companion'
        }
    }
    maven {
        name = 'BlameJared (Veil, JEI)'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower'
            includeGroup 'io.github.ocelot'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

sourceSets {
    inspect {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    inspectImplementation.extendsFrom implementation
    inspectRuntimeOnly.extendsFrom runtimeOnly
    inspectRuntimeOnly.extendsFrom localRuntime
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        criticalmass_inspect {
            sourceSet(sourceSets.inspect)
        }
    }
    runs {
        client {
            client()
            loadedMods = [mods.criticalmass]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            loadedMods = [mods.criticalmass]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        inspect {
            client()
            sourceSet = sourceSets.inspect
            loadedMods = [mods.criticalmass, mods.criticalmass_inspect]
            gameDirectory = project.file('run-inspect')
            systemProperty 'criticalmass.inspect.script', providers.gradleProperty('inspectScript').orElse(project.file('src/inspect/scenes/slice.json').absolutePath).get()
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }


}

neoForge.addModdingDependenciesTo(sourceSets.inspect)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // Sable is the physics engine behind Aeronautics bodies. Its POM drags in a non-slim Create jar,
    // so pull it without transitives and add its real runtime needs explicitly.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")
    implementation("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}") {
        exclude group: 'maven.modrinth'
        exclude group: 'me.fallenbreath'
    }

    // Aeronautics is only needed in the dev client to build and fly test vehicles.
    localRuntime("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    // Create: Loconautics supplies the control desk and its parts. It is not on a public maven,
    // so the jar is kept in libs/ (not committed).
    compileOnly(files("libs/loconautics-${loconautics_version}.jar"))
    localRuntime(files("libs/loconautics-${loconautics_version}.jar"))
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    inspectCompileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            sable_version_range    : sable_version_range,
            loconautics_version_range: loconautics_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
